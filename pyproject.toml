[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-agent-chatbot"
version = "0.4.0"
description = "Pingo IT support: Google ADK, OpenAI, AWS hybrid RAG, MCP diagnostics and SQLite product memory"
requires-python = ">=3.11"
dependencies = ["google-adk>=1.35,<2", "google-genai>=1.50,<2", "litellm>=1.80,<2", "openai>=2,<3", "elasticsearch[async]>=8.17,<9", "aiosqlite>=0.21,<1", "pydantic-settings>=2.10,<3", "httpx>=0.28,<1", "mcp>=1.20,<2", "fastapi>=0.133,<1", "uvicorn>=0.34,<1", "beautifulsoup4>=4.14,<5", "boto3>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.12,<1"]

[project.scripts]
chatbot = "chatbot.cli:main"
pingo = "chatbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
